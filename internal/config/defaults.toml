schema = 1

[app]
default_model = "omniroute/auto/coding"
compact_model = "omniroute/auto/cheap"
fallback_model = "omniroute/auto"
stream = true
system_prompt = ""
system_prompt_file = ""
timeout_s = 120
connect_timeout_s = 10
max_retries = 3
locale = "auto"

[session]
save = true
dir = "$XDG_DATA_HOME/ishakat/sessions"
autoname = true
keep_last = 50
resume_last = false

[ui]
theme = "ascua"
banner = true
markdown = true
syntax = true
reasoning = "collapsed"
timestamps = false
mouse = false
layout = "auto"
max_width = 100
color = "auto"
glyphs = "auto"

[ui.animations]
mode = "auto"
fps = 12
spinner = "charm"
face = true
gradient_scroll = true
battery_saver = "auto"

[ui.footer]
items = ["model", "context", "tokens", "cost", "git", "cwd"]

[keys]
submit = "enter"
newline = "ctrl+j"
cancel = "esc"
quit = "ctrl+c ctrl+c"
clear_screen = "ctrl+l"
model_picker = "ctrl+p"
model_cycle = "ctrl+o"
theme_picker = "ctrl+t"
history_prev = "up"
history_next = "down"
copy_last = "ctrl+y"

[catalog]
sources = ["provider", "modelsdev", "config"]
modelsdev_url = "https://models.dev/api.json"
modelsdev_meta_url = "https://models.dev/models.json"
cache_file = "$XDG_CACHE_HOME/ishakat/catalog.json"
ttl_h = 24
refresh = "background"
offline_ok = true
hide_deprecated = true
prefer_free = false

[compact]
auto = true
trigger_pct = 80
keep_last_turns = 4
summary_tokens = 800
strategy = "summarize"
on_error = "drop-oldest"

# The agent layer (PLAN §19). These defaults decide what a language model is
# allowed to do to this machine, so they are written out in full rather than
# left implicit in Go zero values.
[tools]
enabled = true
dir = "$XDG_DATA_HOME/ishakat/tools"
skills_dir = "$XDG_DATA_HOME/ishakat/skills"
max_tools = 40
archive_days = 90
max_calls_per_turn = 25
max_output_bytes = 32768
budget_usd = 0.0
timeout_s = 120

[tools.permissions]
# Reading cannot damage anything, so it does not interrupt. Writing and running
# commands can, so they do.
read = "allow"
write = "ask"
shell = "ask"
allow_session = true
# Refused outright with an explanation, never offered for confirmation: these
# shapes are not worth a prompt that a tired user approves on autopilot.
shell_deny = [
  "rm -rf /",
  "rm -rf /*",
  "rm -rf ~",
  "rm -rf $HOME",
  "mkfs*",
  "dd if=* of=/dev/*",
  ":(){ :|:& };:",
  "chmod -R 777 /",
  "git push --force*",
  "curl * | sh",
  "curl * | bash",
  "wget * | sh",
  "wget * | bash",
]
# Never read as tool input nor written, regardless of any approval. §19.8's
# structural exfiltration defence: a hard block cannot be argued into a yes by
# anything in the context.
write_deny = [
  "~/.ssh/**",
  "~/.aws/**",
  "~/.gnupg/**",
  "~/.config/ishakat/config.toml",
  "**/.env",
  "**/id_rsa",
  "**/id_ed25519",
]

[tools.evolve]
# "suggest" is proactive about noticing that work repeated, never about
# installing. See §19.7 for why both extremes are worse.
mode = "suggest"
min_repeats = 3
dedup_threshold = 0.8
suggest_per_session = 1
suggest_per_week = 3
decay_after_rejects = 3
require_selftest = true
# With no terminal there is no human to authorize gate 2. --yolo does not grant
# this either; --allow-tool-create is the deliberate per-script opt-in.
allow_without_tty = false

[tools.egress]
allow = [
  "models.dev",
  "api.github.com",
  "raw.githubusercontent.com",
  "pkg.go.dev",
]
allow_all = false

[favorites]
list = ["omniroute/auto/coding", "omniroute/auto/fast", "omniroute/auto/cheap"]

[alias]
smart = "omniroute/auto/coding"
fast = "omniroute/auto/fast"
cheap = "omniroute/auto/cheap"

[[provider]]
id = "omniroute"
name = "OmniRoute"
kind = "openai"
base_url = "http://localhost:20128/v1"
api_key = "$OMNIROUTE_API_KEY"
discover = true
enabled = true
timeout_s = 180
