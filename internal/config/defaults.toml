schema = 1

[app]
# Empty on purpose: this build ships with zero providers pre-authenticated
# (see the [[provider]] block below), so there is nothing default_model
# could safely point at out of the box. `ishakat provider add` sets this
# for you once a real credential is verified (see offerDefaultModel in
# cmd/ishakat/provider.go); `ishakat model set <ref>` does it by hand.
# compact_model empty means "same as default_model" (ResolveModel's own
# empty-string rule); fallback_model empty means "no separate fallback".
default_model = ""
compact_model = ""
fallback_model = ""
stream = true
system_prompt = ""
system_prompt_file = ""
# Step 18: append AGENTS.md rules (global -> project -> local) to the system
# prompt so they don't have to be repeated every message. On by default: a
# project with none of the three files pays nothing for this. Set to false
# to opt a specific run or repository out entirely.
agents_md = true
timeout_s = 120
connect_timeout_s = 10
max_retries = 3
locale = "auto"

[session]
save = true
dir = "$XDG_DATA_HOME/ishakat/sessions"
autoname = true
keep_last = 50
resume_last = false

[ui]
theme = "ascua"
banner = true
markdown = true
syntax = true
reasoning = "collapsed"
timestamps = false
mouse = false
layout = "auto"
max_width = 100
color = "auto"
glyphs = "auto"
# tui_mode: auto | regular | fullscreen — see docs/DESIGN-tui-mode.md §5.
# "auto" detects the terminal (`ishakat doctor` shows the reason); Termux
# always lands on "regular" regardless of what the host otherwise looks like.
tui_mode = "auto"
# fullscreen only: print the whole conversation to the terminal's own
# scrollback on exit, so nothing said while the alternate screen was up is
# lost. Ignored in "regular".
fullscreen_exit_transcript = true
# W2 item 4 (F13, docs/ROADMAP-ux-2026-08-20.md, DECISION-2 consequence 3):
# "one-at-a-time" | "batch". steering_mode governs how many queued
# mid-turn steering messages engine.AgentSink.Inject hands the running
# loop per poll; followup_mode governs how many queued alt+enter
# follow-ups become the next turn once the current one ends. Matches the
# original report's own "one-at-a-time" default for both.
steering_mode = "one-at-a-time"
followup_mode = "one-at-a-time"

[ui.animations]
mode = "auto"
fps = 12
spinner = "charm"
face = false
gradient_scroll = true
battery_saver = "auto"

[ui.footer]
# "autonomy" is §21.4 layer 3's own status word (auto/agile/readonly),
# "shown permanently in the status line" per that section's own table —
# on by default, right after "model", for the same reason the mockup
# places it left-most among the transient/state items: it changes rarely
# and is the one item a human is meant to be able to trust without asking.
items = ["model", "autonomy", "context", "tokens", "cost", "git", "cwd"]

[keys]
submit = "enter"
newline = "ctrl+j"
cancel = "esc"
# A single chord. "Press twice to quit" is quit_repeat, not the same
# chord written twice: tea.KeyPressMsg.String() is one keystroke, so
# "ctrl+c ctrl+c" can never match (RC-1).
quit = "ctrl+c"
quit_repeat = 2
clear_screen = "ctrl+l"
model_picker = "ctrl+p"
model_cycle = "ctrl+o"
theme_picker = "ctrl+t"
history_prev = "up"
history_next = "down"
copy_last = "ctrl+y"
toggle_fold = "ctrl+r"
# W2 item 4 (F13): alt+enter queues the input box as a follow-up instead
# of submitting it now; alt+up re-opens that queue for editing.
queue_followup = "alt+enter"
edit_queue = "alt+up"
# F9: cycles the current model's effort/thinking-level through its own
# catalog.Model.EffortLevels.
effort_cycle = "ctrl+g"

[catalog]
sources = ["provider", "modelsdev", "config"]
modelsdev_url = "https://models.dev/api.json"
modelsdev_meta_url = "https://models.dev/models.json"
cache_file = "$XDG_CACHE_HOME/ishakat/catalog.json"
ttl_h = 24
refresh = "background"
offline_ok = true
hide_deprecated = true
prefer_free = false

# Layer 1 of docs/DESIGN-model-curation.md (internal/catalog/curate.go).
# hide_deprecated above stays a working alias for one release: setting only
# the top-level key still hides deprecated models.
[catalog.curate]
chat_only = true
hide_deprecated = true
hide_superseded = true
hide_dated_twins = true
hide_latest = false
hide = []
keep = []

[compact]
auto = true
trigger_pct = 80
keep_last_turns = 4
summary_tokens = 800
strategy = "summarize"
on_error = "drop-oldest"

# The agent layer (PLAN §19). These defaults decide what a language model is
# allowed to do to this machine, so they are written out in full rather than
# left implicit in Go zero values.
[tools]
enabled = true
dir = "$XDG_DATA_HOME/ishakat/tools"
skills_dir = "$XDG_DATA_HOME/ishakat/skills"
max_tools = 40
archive_days = 90
max_calls_per_turn = 25
max_output_bytes = 32768
budget_usd = 0.0
timeout_s = 120

[tools.permissions]
# Reading cannot damage anything, so it does not interrupt. Writing and running
# commands can, so they do.
read = "allow"
write = "ask"
shell = "ask"
allow_session = true
# Refused outright with an explanation, never offered for confirmation: these
# shapes are not worth a prompt that a tired user approves on autopilot.
shell_deny = [
  "rm -rf /",
  "rm -rf /*",
  "rm -rf ~",
  "rm -rf $HOME",
  "mkfs*",
  "dd if=* of=/dev/*",
  ":(){ :|:& };:",
  "chmod -R 777 /",
  "git push --force*",
  "curl * | sh",
  "curl * | bash",
  "wget * | sh",
  "wget * | bash",
]
# Never read as tool input nor written, regardless of any approval. §19.8's
# structural exfiltration defence: a hard block cannot be argued into a yes by
# anything in the context.
write_deny = [
  "~/.ssh/**",
  "~/.aws/**",
  "~/.gnupg/**",
  "~/.config/ishakat/config.toml",
  "**/.env",
  "**/id_rsa",
  "**/id_ed25519",
]

[tools.evolve]
# "suggest" is proactive about noticing that work repeated, never about
# installing. See §19.7 for why both extremes are worse.
mode = "suggest"
min_repeats = 3
dedup_threshold = 0.8
suggest_per_session = 1
suggest_per_week = 3
decay_after_rejects = 3
require_selftest = true
# With no terminal there is no human to authorize gate 2. --yolo does not grant
# this either; --allow-tool-create is the deliberate per-script opt-in.
allow_without_tty = false

[tools.egress]
allow = [
  "models.dev",
  "api.github.com",
  "raw.githubusercontent.com",
  "pkg.go.dev",
]
allow_all = false

# §21.4 layer 3 / §21.12: what a project with no trust.json record falls
# back to before its first-run trust dialog (§21.4 layer 2) ever answers it,
# and whether that dialog's own answer gets written down at all. "ask" here
# is not itself an autonomy value -- it is the fourth state, "no decision
# recorded yet", so the dialog opens on first run rather than silently
# picking agile or auto for a project nobody has looked at.
[autonomy]
default = "ask"
remember = true

# Step 23: the third door. Loopback-only by default (addr) and no token
# required, which is safe together — an empty token only skips checking a
# secret that a non-loopback address would otherwise need. Changing addr to
# anything routable without also setting token is exactly the case
# validateServe warns loudly about.
[serve]
addr = "127.0.0.1:20129"
token = ""
allow_tool_create = false
max_sessions = 8
idle_timeout_s = 600

[favorites]
list = []

[alias]

# OmniRoute ships declared but disabled: a fresh install has zero active
# providers and therefore zero startup noise about missing credentials.
# `ishakat provider add omniroute` (or openai/anthropic/nvidia/gemini)
# enables whichever one the user actually wants — see
# internal/config/credentials.go's ProviderPresets for the full list this
# entry mirrors.
[[provider]]
id = "omniroute"
name = "OmniRoute"
kind = "openai"
base_url = "http://localhost:20128/v1"
api_key = "$OMNIROUTE_API_KEY"
discover = true
enabled = false
timeout_s = 180
